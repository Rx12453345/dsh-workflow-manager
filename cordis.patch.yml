# dsh-workflow — bundle patch layer
#
# Inserted AFTER every bundle layer by the DSH loader.
# Three rows, each independently switchable:
#   - module : declaration-only row that makes the browser half discoverable
#   - core   : model-facing tools + workflow state machine (Host only)
#   - panel  : owns the panel namespace; the sidebar entry and its body are
#              registered by the package's one browser half (see that row's comment)
#
# The panel row was shipped `disabled: true` for the first install so that a
# bundle-load failure could never break the host; it is now enabled, after the host
# scan and the settings page both came up clean.
#
# WHAT DISABLING THIS ROW ACTUALLY DOES: it withdraws the SIDEBAR ENTRY. The settings
# page on the Plugins page does NOT go away, because that page is registered against
# the CORE row's namespace from the package's browser half; the sidebar entry is the
# part that follows this row (the browser half waits for this row's namespace through
# `ctx.configForms.whileServed`, and gates the entry on this row's `showInSidebar`).
# Every model-facing tool keeps working either way.
#
# Adjust all runtime parameters from the settings page or from the project's own
# `.dsh/workflow.yml`; this file only needs the defaults below.

- insert:
    # ── module row: exists ONLY so the browser half is discoverable ─────────────
    #
    # `dsh-client-modules` resolves each row's package with `exactPackageSpecifier`,
    # which returns undefined for any non-scoped specifier containing "/". The two
    # rows below are mounted as `<package>/core` and `<package>/panel`, so neither
    # can ever expose this package's `dsh.client` declaration — the browser half gets
    # dropped silently, with no error anywhere. This row is mounted as the BARE
    # package name, which is what makes the declaration resolvable (compare
    # dsh-agnes-multimodal-fixed, which mounts its package root directly).
    #
    # It runs `apply` with `rowKind: module` and registers nothing, so the tools are
    # still registered exactly once, by the core row.
    - id: dsh-workflow-module
      name: src-12453345_-dsh-workflow
      config:
        rowKind: module

    - id: dsh-workflow-core
      name: src-12453345_-dsh-workflow/core
      config:
        # ---- works only in projects that opted in (.dsh/workflow.yml present) ----
        requireOptIn: true

        # ---- workflow tier ----
        tier: standard # minimal | standard | strict
        recipe: null   # overrides tier when set: hotfix | spike | refactor | docs | review

        # ---- module switches: every mechanism can be turned off ----
        modules:
          planner: true
          featuresJson: true
          progressLog: true
          handoffDoc: true
          acceptance: true
          independentReview: true
          selfVerify: true
          gcCode: true
          gcDocs: true
          constraintLedger: true
          stats: true
          gitCommitPerFeature: true
          isolation: true

        # ---- context isolation / budget ----
        context:
          maxInlineTokens: 12500
          overflow: spill-to-file
          exclude:
            - tool_history
            - error_logs
            - prior_attempts
            - reasoning
          requireBootstrap: true

        # ---- acceptance negotiation ----
        acceptance:
          negotiateBeforeBuild: true
          maxRounds: 3

        # ---- independent evaluation (never self-review) ----
        evaluator:
          independent: true
          bar: 8
          # 2, not 3: unreachable findings no longer block (see decideVerdict), and the
          # evidence from a live loop is that round two carries the value while round three
          # carries the cost. Running out reports `exhausted`, which is the honest terminal
          # state — take the work to real operation or to a human.
          maxRounds: 2
          dimensions:
            - correctness
            - build
            - tests
            - regressions
            - archFit
            - legibility
            - scope
          mustPass:
            - correctness
            - build
            - regressions

        # ---- computational sensors, cheapest first ----
        verifier:
          sensors:
            - typecheck
            - lint
            - test
            - build
            - smoke
            - arch_test
          stopOnFirstFailure: true
          feedMessageStyle: actionable

        # ---- hard guards ----
        guards:
          forbidTestEdits: true
          forbidNewDeps: false
          maxFilesPerFeature: null
          requireHumanOnFatal: true

        # ---- subagent limits ----
        #
        # maxDepth is an ABSOLUTE ceiling on the delegation tree, not a per-call budget:
        # the service computes childDepth = delegationDepthOf(parent) + 1 and refuses when
        # childDepth > maxDepth. So 1 forbids the recommended architecture —
        # main agent (0) -> orchestrator child (1) -> its reviewer (2) — and forces every
        # review back into the main conversation, which is the context pollution this
        # plugin exists to avoid. 2 permits that one level and nothing deeper, so
        # unbounded recursion stays impossible while a delegated orchestrator can still
        # verify its own work.
        subagent:
          maxDepth: 2 # 1 forbids a delegated orchestrator from reviewing; 2 permits it
          maxActiveSubagents: 8 # exceeds -> ACTIVATION_LIMIT_REACHED (no queueing)
          keyRolesModel: false # allow a stronger model for planner/evaluator
          keyRolesProvider: ''
          keyRolesModelId: ''

        # ---- approval strength (see design doc §11.5) ----
        approval:
          strength: ask-user # ask-user | llm-then-user | llm-only | off
          riskThreshold: medium # low | medium | high
          denyHighAlways: true
          exemptTools: []

        # ---- risk-based verification depth ----
        #
        # `off` keeps the historical behaviour exactly: a caller that declares no change class
        # gets the full loop it always got. `advisory` resolves and REPORTS the class for the
        # changed files without refusing anything. `enforced` additionally refuses a declaration
        # the changed files contradict (declaring "docs" while the diff touches lib/approval.js)
        # and asks the user to confirm the resolved depth.
        #
        # The `security` class is not degradable at any setting: a change touching an approval,
        # authorization or permissions surface resolves to the deepest rung regardless of how it
        # is declared. An unrecognised class, an unusable value, or unreadable evidence all
        # resolve to the STRICTER depth, never the looser one.
        verification:
          policy: off # off | advisory | enforced
          confirmation: on-override # never | on-override | always
          report: true # print the resolved class and depth in workflow_status

        # ---- escalation triggers ----
        escalation:
          onContextOverflow: true
          featureAttempts: 3
          onScopeCreep: true
          sensorRepeatFailures: 2

        # ---- budget ----
        budget:
          maxMinutes: null
          maxSubagentCalls: null
          onExceed: ask # ask | stop | continue

        # ---- constraint retirement ----
        retireCheck:
          enabled: true
          everyDays: 30
          autoSuggest: true

        # ---- high-cost sign-off gates ----
        signoff:
          beforeGenerate: false
          beforeExpensiveBuild: false
          beforeBulkEdit: true

    - id: dsh-workflow-panel
      name: src-12453345_-dsh-workflow/panel
      # Now enabled: the host scanned this row and the core row came up clean, so the
      # client bundle can be validated without risking a bundle-load failure on a
      # first-ever install.
      #
      # WHAT THIS ROW IS NOW, corrected. Its Host half (`lib/components/panel/index.js`)
      # registers nothing — it only reports whether the settings service is up. Its real
      # job is to own the PANEL namespace: `showInSidebar` / `sidebarLabel` /
      # `showInPluginPage` are declared on this row's schema, and the browser half in
      # `lib/client.js` reads them back with `ctx.configForms.get('dsh-workflow-panel')`.
      # The sidebar entry and its `main` body are registered from THAT bundle — the
      # package's one browser half — not from a second bundle: `dsh-client-modules`
      # attaches a browser half to the Loader row whose specifier is the BARE package
      # name, so a `<package>/panel` row could never carry one. See
      # `lib/components/panel/index.js` for the comment that used to claim otherwise.
      disabled: false
      config:
        # Read at panel-registration time (through the settings service, not from this
        # file): false withdraws the sidebar entry and its body; every tool keeps working.
        showInSidebar: true
        # The sidebar entry's visible text, accessible name and collapsed tooltip. Blank
        # falls back to the `panelLabel` dictionary entry, then to the panel id.
        sidebarLabel: 工作流设置
        # NOT READ YET — nothing consumes this switch, and it is not wired to anything.
        showInPluginPage: true
